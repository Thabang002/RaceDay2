# Continuous integration for RaceDay (API + MVC front end + tests).
# Runs on every push / pull request to master:
#   1. restores, builds and tests the whole solution
#   2. builds the RaceDay.Web Docker image to prove the Dockerfile works
name: RaceDay CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Azurite = local Azure Blob Storage emulator, used by any test that touches image storage.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaceDay.slnx

      - name: Build
        run: dotnet build RaceDay.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --verbosity normal

  docker-web:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RaceDay.Web Docker image
        run: docker build -t raceday-web:ci ./RaceDay.Web
